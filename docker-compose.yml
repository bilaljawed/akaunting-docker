version: '3.7'

services:
  akaunting:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - akaunting-data:/var/www/html
    restart: unless-stopped
    environment:
      # Database connection (Pulls from Railway Variables)
      - DB_CONNECTION=mysql
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - AKAUNTING_SETUP=${AKAUNTING_SETUP:-true}
      - APP_URL=${APP_URL}
      
      # App Settings
      - APP_URL=${APP_URL}
      - AKAUNTING_SETUP=${AKAUNTING_SETUP:-true}

volumes:
  akaunting-data:
