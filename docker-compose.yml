version: '3.7'

services:
  akaunting:
    container_name: akaunting
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - akaunting-data:/var/www/html
    restart: unless-stopped
    environment:
      # Database connection (using your provided credentials)
      - DB_CONNECTION=mysql
      - DB_HOST=yamanote.proxy.rlwy.net
      - DB_PORT=12653
      - DB_DATABASE=railway
      - DB_USERNAME=root
      - DB_PASSWORD=tqVKMOqWXDdjumrMtjOvSlKADSdOrlrJ
      
      # App Settings
      - APP_URL=https://${RAILWAY_PUBLIC_DOMAIN:-localhost}
      - AKAUNTING_SETUP=${AKAUNTING_SETUP:-true}

volumes:
  akaunting-data:
