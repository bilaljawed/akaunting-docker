version: '3.7'

services:
  akaunting:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - akaunting-data:/var/www/html
    restart: unless-stopped
    env_file:
      - env/run.env
    environment:
      - AKAUNTING_SETUP=${AKAUNTING_SETUP:-true}
      - DB_HOST=akaunting-db
      - DB_PORT=3306
    depends_on:
      - akaunting-db

  akaunting-db:
    image: mariadb:10.6
    volumes:
      - akaunting-db:/var/lib/mysql
    restart: unless-stopped
    env_file:
      - env/db.env
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-akaunting}
      - MYSQL_USER=${MYSQL_USER:-akaunting}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}

volumes:
  akaunting-data:
  akaunting-db:
